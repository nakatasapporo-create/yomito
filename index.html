<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f9f7ee"><meta name="description" content="写真の文字を声で聞ける、こどものためのアプリ。"><title>よみと</title><link rel="stylesheet" href="style.css"></head>
<body>
<svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
<symbol id="icon-camera" viewBox="0 0 64 64"><path d="M9 19h12l5-8h12l5 8h12a4 4 0 0 1 4 4v29a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V23a4 4 0 0 1 4-4Z"/><circle cx="32" cy="36" r="12"/><path d="M49 26h2"/></symbol>
<symbol id="icon-sound" viewBox="0 0 64 64"><path d="M8 24h12l14-13v42L20 40H8Z"/><path d="M43 23a15 15 0 0 1 0 18M50 14a27 27 0 0 1 0 36"/></symbol>
<symbol id="icon-stop" viewBox="0 0 64 64"><rect x="15" y="15" width="34" height="34" rx="5" fill="currentColor" stroke="none"/></symbol>
<symbol id="icon-photo" viewBox="0 0 64 64"><rect x="8" y="8" width="48" height="48" rx="7"/><circle cx="23" cy="23" r="5"/><path d="m9 46 13-13 10 10 10-16 14 19"/></symbol>
<symbol id="icon-settings" viewBox="0 0 64 64"><path d="M12 16h40M12 32h40M12 48h40"/><circle cx="24" cy="16" r="5" fill="var(--cream)"/><circle cx="42" cy="32" r="5" fill="var(--cream)"/><circle cx="24" cy="48" r="5" fill="var(--cream)"/></symbol>
<symbol id="icon-check" viewBox="0 0 64 64"><path d="m14 32 12 12 25-26"/></symbol>
<symbol id="icon-retry" viewBox="0 0 64 64"><path d="M16 21a21 21 0 1 1-4 23M16 8v15H3"/></symbol>
</defs></svg>
<header><span class="logo">よみと<span>・</span></span><button id="help" class="utility" aria-label="おうちの方の設定"><svg><use href="#icon-settings"/></svg></button></header>
<main>
<section class="photo-stage" id="stage" aria-label="しゃしん"><div id="illustration" aria-hidden="true"><svg class="empty-camera"><use href="#icon-camera"/></svg></div><img id="preview" alt="えらんだしゃしん" hidden><div id="stateBadge" hidden aria-hidden="true"><svg><use href="#icon-check"/></svg></div><progress id="progress" max="1" value="0" aria-label="もじを よみとっています" hidden></progress></section>
<div class="controls"><button class="big-button camera" id="camera" aria-label="しゃしんを とる"><svg><use href="#icon-camera"/></svg><span>しゃしん</span></button><button class="big-button speak" id="speak" aria-label="よみあげる" disabled><svg><use href="#icon-sound"/></svg><span>きく</span></button><button class="big-button stop" id="stop" aria-label="よみあげを とめる" disabled><svg><use href="#icon-stop"/></svg><span>とめる</span></button></div>
<div id="status" role="status" aria-live="polite"></div>
<input type="file" id="cameraInput" accept="image/*" capture="environment" hidden><input type="file" id="albumInput" accept="image/*" hidden>
</main>
<dialog id="helpDialog"><button id="closeHelp" class="close" aria-label="とじる">×</button><h1>おうちの方へ</h1><p>カメラで撮影し、読み取りが終わったら、スピーカーのボタンを押してください。</p>
<button class="album-button" id="choose"><svg><use href="#icon-photo"/></svg>アルバムから選ぶ</button>
<label class="field-label" for="text">読み上げる文字（修正できます）</label><textarea id="text" placeholder="写真から読み取った文字がここに表示されます。直接入力もできます。"></textarea>
<div class="speed"><span class="field-label">読む速さ</span><div class="segmented" role="group" aria-label="読む速さ"><button data-rate="0.65">ゆっくり</button><button data-rate="0.85" class="selected" aria-pressed="true">ふつう</button><button data-rate="1.1">はやめ</button></div></div>
<button id="clear" class="clear" disabled>写真と文字を消す</button>
<details><summary>使い方・写真について</summary><p>iPadのSafariでご利用ください。明るい場所で、印刷された横書きの文字を大きく、まっすぐ撮ると読み取りやすくなります。手書き・縦書き・ふりがななどは読み間違える場合があります。</p><p>写真の文字認識はブラウザー内で処理し、写真や文章をこのアプリのサーバーに送信・保存しません。初回はインターネット接続が必要です。読み上げには端末の音声機能を使います。音が出ない場合は端末の音量を確認してください。</p></details></dialog>
<script src="app.js"></script></body></html>
